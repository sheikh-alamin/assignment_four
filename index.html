<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
        font-optical-sizing: auto;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC]">
    <header class="">
      <div class="heading bg-slate-200 max-w-[80%] mx-auto p-5">
        <h1 class="pt-10 text-[#002C5C] text-2xl font-bold">
          Job Application Tracker
        </h1>
        <div class="heading_details grid grid-cols-3 gap-6 mx-auto p-6">
          <div class="detail_one p-4 rounded-md bg-white">
            <p>Total</p>
            <h2 id="totalCount" class="text-neutral font-bold">8</h2>
          </div>
          <div class="detail_two p-4 rounded-md bg-white">
            <p>Interview</p>
            <h2 id="interviewCount" class="text-green-500 font-bold">0</h2>
          </div>
          <div class="detail_three p-4 rounded-md bg-white">
            <p>Rejected</p>
            <h2 id="rejectedCount" class="text-red-500 font-bold">0</h2>
          </div>
        </div>
      </div>
    </header>

    <hr class="my-10 max-w-[80%] mx-auto" />

    <main class="heading bg-slate-200 max-w-[80%] mx-auto">
      <div class="main_heading py-5 flex justify-between">
        <div class="left">
          <h2>Available Jobs</h2>
        </div>
        <div class="right flex gap-2">
          <h2>0</h2>
          <p>Jobs</p>
        </div>
      </div>
      <div class="tab_buttons">
        <button class="btn btn-active btn-primary" id="all-filter-btn">All</button>
        <button class="btn btn-soft btn-primary" id="interview-filter-btn">Interview</button>
        <button class="btn btn-soft btn-primary" id="rejected-filter-btn">Rejected</button>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
